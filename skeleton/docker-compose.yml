version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chisel_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chisel_network

  mongodb:
    image: mongo:7.0
    container_name: chisel_mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - mongodata:/data/db
    networks:
      - chisel_network

volumes:
  pgdata:
    driver: local
  mongodata:
    driver: local

networks:
  chisel_network:
    driver: bridge
